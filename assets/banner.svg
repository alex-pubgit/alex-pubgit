<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Alex Booth, AI systems engineer</title>
  <desc id="desc">Document chatbots that cite their sources, support bots and payment automation for crypto teams. Scope in writing first, tested before delivery, read-only by default.</desc>

  <rect width="1200" height="300" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="13.5" fill="none" stroke="#30363d"/>
  <rect x="56" y="58" width="4" height="210" rx="2" fill="#3fb950"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="84" y="84" fill="#3fb950" font-size="16" font-weight="600" letter-spacing="3"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">AI SYSTEMS ENGINEER</text>
    <text x="81" y="150" fill="#f0f6fc" font-size="62" font-weight="700">Alex Booth</text>
    <text x="84" y="193" fill="#c9d1d9" font-size="23">Document chatbots that cite their sources.</text>
    <text x="84" y="225" fill="#c9d1d9" font-size="23">Support bots and payment automation for crypto teams.</text>

    <g fill="#8b949e" font-size="16">
      <rect x="84" y="251" width="8" height="8" rx="2" fill="#3fb950"/>
      <text x="102" y="261">Scope in writing first</text>
      <rect x="296" y="251" width="8" height="8" rx="2" fill="#3fb950"/>
      <text x="314" y="261">Tested before delivery</text>
      <rect x="516" y="251" width="8" height="8" rx="2" fill="#3fb950"/>
      <text x="534" y="261">Read-only by default, no private keys</text>
    </g>
  </g>

  <!-- How a job moves: four steps, the test step highlighted -->
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
     font-size="14" text-anchor="middle" letter-spacing="2">
    <g stroke="#30363d" stroke-width="1.5">
      <line x1="1050" y1="93" x2="1050" y2="107"/>
      <line x1="1050" y1="143" x2="1050" y2="157"/>
      <line x1="1050" y1="193" x2="1050" y2="207"/>
    </g>
    <rect x="975" y="57" width="150" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="1050" y="80" fill="#c9d1d9">SCOPE</text>
    <rect x="975" y="107" width="150" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="1050" y="130" fill="#c9d1d9">BUILD</text>
    <rect x="975" y="157" width="150" height="36" rx="8" fill="#12261a" stroke="#3fb950"/>
    <text x="1050" y="180" fill="#3fb950">TEST</text>
    <rect x="975" y="207" width="150" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="1050" y="230" fill="#c9d1d9">DELIVER</text>
  </g>
</svg>
